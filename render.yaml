# Render.com Infrastructure Blueprint for InnovX
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: innovx-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        sync: false # Set to https://innovx.vercel.app,https://your-custom-domain.com
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard from Google AI Studio
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard
